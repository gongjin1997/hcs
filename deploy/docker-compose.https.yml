# 启用 HTTPS：.env 中 COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml；证书放 nginx/certs/server.crt、server.key
services:
  web:
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"]
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
