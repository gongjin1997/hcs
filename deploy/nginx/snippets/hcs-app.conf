# HCS-Inspector 站点公共配置：http.conf / https.conf 的 server 块 include 本文件
root /usr/share/nginx/html;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /nginx-health { allow all; access_log off; default_type text/plain; return 200 "ok"; }   # 容器健康检查，不受白名单限制
# 静态资源长缓存（文件名带 hash），index.html 不缓存
location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
# Prometheus 指标：默认拒绝；在 snippets/metrics-allow.conf 放行 Prometheus 服务器 IP 后，
# 用 http(s)://<控制台地址>/metrics 抓取，并带 Authorization: Bearer <INSPECTOR_METRICS_TOKEN>
location = /metrics {
    include /etc/nginx/snippets/metrics-allow.conf;
    proxy_pass http://api:8000/metrics;
    proxy_set_header X-Real-IP $remote_addr;
}
location /metrics/ { return 404; }

# SSE（告警实时推送）：关闭缓冲、延长超时
location /api/v1/stream/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}
location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;          # 报表生成 / Excel 导入
    client_max_body_size 20m;         # Excel 导入（单次最多 5000 行）
}
# 前端 History 路由
location / { try_files $uri $uri/ /index.html; include /etc/nginx/snippets/security-headers.conf; }
