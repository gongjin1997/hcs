# http 上下文，由 http.conf / https.conf 各 include 一次；不记录 request_uri、args、headers 或请求体。
map $uri $hcs_log_path {
    ~*^/api/v1/mail-actions(?:/|$) /api/v1/mail-actions/[REDACTED];
    ~*^/m/action(?:/|$) /m/action/[REDACTED];
    default $uri;
}

# 只记录后端响应的已校验关联 ID，绝不信任客户端原始请求头。
map $upstream_http_x_request_id $hcs_log_request_id {
    default "";
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $upstream_http_x_request_id;
}

log_format hcs_json escape=json
    '{"ts":"$time_iso8601","level":"INFO","service":"nginx","logger":"nginx.access",'
    '"request_id":"$hcs_log_request_id","method":"$request_method","path":"$hcs_log_path",'
    '"status":$status,"request_time_sec":"$request_time","upstream_time_sec":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","bytes_sent":$body_bytes_sent}';

access_log /dev/stdout hcs_json;
