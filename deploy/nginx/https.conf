# HTTPS 站点：.env 中 COMPOSE_FILE 追加 :docker-compose.https.yml 后生效
# 证书放在 deploy/nginx/certs/server.crt（含中间证书链）与 server.key；WEB_HTTPS_PORT 不是 443 时把下面的跳转改成 https://$host:<端口>$request_uri
include /etc/nginx/snippets/logging.conf;

server {
    listen 80 default_server;
    server_name _;
    location = /nginx-health { allow all; access_log off; default_type text/plain; return 200 "ok"; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/allowlist.conf;
    include /etc/nginx/snippets/hcs-app.conf;
}
