# 本地一键启动完整环境：docker compose -f deploy/docker-compose.yml up -d --build
# 控制台 http://localhost:8080（演示账号见 backend/app/services/seed.py，仅开发 / 演示环境写入）   邮件查看 http://localhost:8025（Mailpit）
name: hcs-inspector
x-backend-env: &backend-env
  INSPECTOR_ENV: dev
  INSPECTOR_DATABASE_URL: postgresql+psycopg://inspector:inspector@postgres:5432/inspector
  INSPECTOR_REDIS_URL: redis://redis:6379/0
  INSPECTOR_JWT_SECRET: please-change-me-to-32-plus-random-bytes
  INSPECTOR_MAIL_LINK_SECRET: please-change-me-too
  INSPECTOR_BASE_URL: http://localhost:8080
  INSPECTOR_SMTP_HOST: mailpit
  INSPECTOR_SMTP_PORT: "1025"
  INSPECTOR_HCS_SCHEME: http
  INSPECTOR_HCS_IAM_URL: http://mock-hcs:9000
  INSPECTOR_HCS_PASSWORD: mock-password
  INSPECTOR_HCS_PROJECT_ID: 0a1b2c3d4e5f
  INSPECTOR_HCS_WORKSPACES: '["ws-bigdata"]'
  # 巡检服务挂在 Mock 根路径，台账同步服务挂在 /ecs、/evs ... 前缀下
  INSPECTOR_HCS_ENDPOINTS: '{"dataarts":"mock-hcs:9000","mrs":"mock-hcs:9000","gaussdb":"mock-hcs:9000","dcs":"mock-hcs:9000","ces":"mock-hcs:9000","ecs":"mock-hcs:9000/ecs","evs":"mock-hcs:9000/evs","vpc":"mock-hcs:9000/vpc","elb":"mock-hcs:9000/elb","rds":"mock-hcs:9000/rds","dms":"mock-hcs:9000/dms","cce":"mock-hcs:9000/cce","dws":"mock-hcs:9000/dws","css":"mock-hcs:9000/css"}'
  INSPECTOR_REPORT_MAIL_TO: '["ops-team@example.com"]'

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: inspector, POSTGRES_USER: inspector, POSTGRES_PASSWORD: inspector}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U inspector"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
  mock-hcs:
    build: ../backend
    command: ["uvicorn", "mock_hcs.app:app", "--host", "0.0.0.0", "--port", "9000"]
  migrate:
    build: ../backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.workers.bootstrap"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: ../backend
    environment: *backend-env
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
  scheduler:
    build: ../backend
    environment: *backend-env
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on: {api: {condition: service_healthy}, mock-hcs: {condition: service_started}}
  notifier:
    build: ../backend
    environment: *backend-env
    command: ["python", "-m", "app.workers.notifier"]
    depends_on: {api: {condition: service_healthy}, mailpit: {condition: service_started}}
  web:
    build: ../frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
