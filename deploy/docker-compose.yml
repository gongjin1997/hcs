# HCS-Inspector 生产部署（单机独立 docker-compose）。在 deploy 目录执行：make install（首次）/ make upgrade（升级）
# 配置全部在同目录 .env（scripts/gen-env.sh 生成）；COMPOSE_FILE 决定是否叠加 https / demo 覆盖文件
name: ${COMPOSE_PROJECT_NAME:-hcs-inspector}

x-logging: &logging
  driver: json-file
  options: {max-size: "50m", max-file: "5"}

# 后端公共配置：api / scheduler / notifier / migrate 共用同一镜像与 .env
x-backend: &backend
  image: ${IMAGE_PREFIX:-hcs-inspector}-backend:${HCS_INSPECTOR_VERSION:-0.4.0}
  env_file: [.env]
  environment:
    INSPECTOR_DATABASE_URL: ${INSPECTOR_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-inspector}:${POSTGRES_PASSWORD:?请先执行 scripts/gen-env.sh 生成 .env}@postgres:5432/${POSTGRES_DB:-inspector}}
    INSPECTOR_REDIS_URL: ${INSPECTOR_REDIS_URL:-redis://redis:6379/0}
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - exports:/app/data
    - ./certs:/app/certs:ro
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inspector}
      POSTGRES_USER: ${POSTGRES_USER:-inspector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先执行 scripts/gen-env.sh 生成 .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes: ["${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
    logging: *logging

  redis:            # 分布式锁 + 调度 / 通知进程到 API 的实时事件转发（SSE）
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: ["${DATA_DIR:-./data}/redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
    logging: *logging

  migrate:          # 一次性：数据库迁移 + 幂等初始化（内置规则 / 巡检任务；首次部署创建 admin）。升级时先于新版本进程执行
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.workers.bootstrap"]
    restart: "no"
    healthcheck: {disable: true}
    depends_on: {postgres: {condition: service_healthy}}

  api:
    <<: *backend
    # 不映射端口：只经 web（nginx）访问；内网 Prometheus 抓取 /metrics 见 docs/部署运维手册.md「监控对接」
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  scheduler:        # 巡检任务 / 台账同步 / 定时报表 / 数据清理（APScheduler + Redis 锁）
    <<: *backend
    command: ["python", "-m", "app.workers.scheduler"]
    stop_grace_period: 45s
    healthcheck: {test: ["CMD", "python", "-m", "app.tools.status", "--check", "scheduler"], interval: 60s, timeout: 20s, start_period: 90s, retries: 3}
    depends_on: {api: {condition: service_healthy}}

  notifier:         # Outbox → SMTP 投递、未认领升级、静默到期补发、平台自身告警看护
    <<: *backend
    command: ["python", "-m", "app.workers.notifier"]
    healthcheck: {test: ["CMD", "python", "-m", "app.tools.status", "--check", "notifier"], interval: 60s, timeout: 20s, start_period: 90s, retries: 3}
    depends_on: {api: {condition: service_healthy}}

  web:              # nginx：前端静态资源 + /api 反向代理（SSE 不缓冲）
    image: ${IMAGE_PREFIX:-hcs-inspector}-web:${HCS_INSPECTOR_VERSION:-0.4.0}
    ports: ["${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"]
    environment: {TZ: "${TZ:-Asia/Shanghai}"}
    volumes:
      - ./nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"], interval: 30s, timeout: 3s, retries: 3}
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging

volumes:
  exports:          # /app/data：探测报告等导出文件（make probe 自动拷出到 deploy/exports）
