name: Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, 'refactor/**']

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/constraints.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -c constraints.txt -e ".[dev]"

      - name: Lint with ruff
        run: cd backend && ruff check .

      - name: Type check with mypy
        run: cd backend && mypy app mock_hcs

      - name: Test scripts
        run: |
          python -m unittest discover -s scripts -p test_lan.py
          python -m unittest discover -s scripts -p test_offline_deploy.py
          python -m unittest discover -s scripts -p test_code_bundle.py
          python -m unittest discover -s scripts -p test_release_manager.py
          python -m unittest discover -s scripts -p test_compose_compat.py
          python -m unittest discover -s scripts -p test_network_check.py

      - name: Run pytest with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term --cov-report=xml --junitxml=report.xml

      - name: Test migrations
        run: |
          cd backend
          INSPECTOR_DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          INSPECTOR_DATABASE_URL=sqlite:///./ci.db alembic check

      - name: Test bootstrap
        run: |
          cd backend
          INSPECTOR_DATABASE_URL=sqlite:///./ci.db INSPECTOR_DEMO_SEED=false python -m app.workers.bootstrap

      - name: Test status tool
        run: |
          cd backend
          INSPECTOR_DATABASE_URL=sqlite:///./ci.db python -m app.tools.status || test $? -eq 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/report.xml

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npm run typecheck

      - name: Run tests
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcs_test
          POSTGRES_PASSWORD: hcs_ci_test_only
          POSTGRES_DB: hcs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/constraints.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -c constraints.txt -e ".[dev,postgres]"

      - name: Run PostgreSQL tests
        env:
          INSPECTOR_TEST_DATABASE_URL: postgresql+psycopg://hcs_test:hcs_ci_test_only@localhost:5432/hcs_test
        run: |
          cd backend
          pytest --junitxml=report-pg.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pg-test-results
          path: backend/report-pg.xml

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          cd deploy
          sed 's/__GEN_[A-Z0-9_]*__/ci/' .env.example > .env
          docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.demo.yml docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.offline.yml config -q

      - name: Validate shell scripts
        run: |
          cd deploy
          for f in deploy.sh install.sh scripts/*.sh; do bash -n "$f"; done
          make -n install upgrade backup status >/dev/null
