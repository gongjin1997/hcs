# 镜像内置的默认配置（与 deploy/nginx/http.conf + snippets 等价）；部署时由 compose 挂载 deploy/nginx 下的配置覆盖
map $uri $hcs_log_path {
    ~*^/api/v1/mail-actions(?:/|$) /api/v1/mail-actions/[REDACTED];
    ~*^/m/action(?:/|$) /m/action/[REDACTED];
    default $uri;
}
map $upstream_http_x_request_id $hcs_log_request_id {
    default "";
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $upstream_http_x_request_id;
}
log_format hcs_json escape=json
    '{"ts":"$time_iso8601","level":"INFO","service":"nginx","logger":"nginx.access",'
    '"request_id":"$hcs_log_request_id","method":"$request_method","path":"$hcs_log_path",'
    '"status":$status,"request_time_sec":"$request_time","upstream_time_sec":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","bytes_sent":$body_bytes_sent}';
access_log /dev/stdout hcs_json;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok"; }
    location ~* \.map(?:/|$) { return 404; }  # 调试映射仅在本机用于定位，不通过站点发布
    # 静态资源长缓存（文件名带 hash），index.html 不缓存
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
    # Prometheus 指标只给内网直连 API 容器抓取，不经 nginx 暴露
    location /metrics { return 404; }

    # SSE（告警实时推送）：关闭缓冲、延长超时
    location /api/v1/stream/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /api/docs {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-Id $http_x_request_id;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;          # 报表生成 / Excel 导入
        client_max_body_size 20m;         # Excel 导入（单次最多 5000 行）
    }
    # 前端 History 路由
    location / { try_files $uri $uri/ /index.html; }
}
